<!doctype html><html lang="es"><meta charset="utf-8"><title>Registro comercial externo</title><style>body{font:16px system-ui;max-width:680px;margin:3rem auto;padding:0 1rem}input,textarea{width:100%;box-sizing:border-box;margin:.35rem 0 1rem;padding:.6rem}button{padding:.7rem 1rem}#result{white-space:pre-wrap}</style><h1>Registro comercial</h1><p>Envía un registro para revisión interna. No genera una asignación automática.</p><form id="f"><label>Clave de integración<input id="token" type="password" required></label><label>Referencia externa<input name="external_reference" required></label><label>Empresa<input name="company_name" required></label><label>NIT<input name="nit"></label><label>Sector<input name="sector"></label><label>Ciudad<input name="city"></label><label>Zona<input name="zone"></label><label>Monto estimado<input name="estimated_revenue" type="number" min="0"></label><label>Nota<textarea name="notes"></textarea></label><button>Enviar para revisión</button></form><p id="result"></p><script>f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(!d.estimated_revenue)delete d.estimated_revenue;else d.estimated_revenue=Number(d.estimated_revenue);result.textContent='Enviando…';let r=await fetch('http://localhost:8000/external/records',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token.value},body:JSON.stringify(d)});result.textContent=r.ok?'Registro recibido: '+(await r.json()).record_id:'Error: '+(await r.text())}</script>
